set -g @plugin 'tmux-plugins/tpm'                                                                                                                                                                                                      
set -g @plugin 'tmux-plugins/tmux-sensible'                                                                                                                                                                                            
set -g @plugin 'tmux-plugins/tmux-yank'                                                                                                                                                                                                
run '~/.tmux/plugins/tpm/tpm'                                                                                                                                                                                                          
                                                                                                                                                                                                                                       
set -g mouse on                                                                                                                                                                                                                        
bind-key r source-file ~/.tmux.conf \; display-message "~/.tmux.conf reloaded"

set-option -g default-terminal "tmux-256color"
set-option -g status-key "emacs"

set-option -g status-bg "#666666"
set-option -g status-fg "#aaaaaa"
set-option -g status-left-length 50

set-option -g mouse on
set-option -g history-limit 102400

set -g status-right '#{prefix_highlight} | %Y-%m-%d %H:%M'

set -g base-index 1
set -g renumber-windows on

bind-key - split-window -v -c '#{pane_current_path}'
bind-key | split-window -h -c '#{pane_current_path}'
bind c new-window -c "#{pane_current_path}"
bind-key b break-pane -d

bind-key j choose-tree -swZ

bind -n S-Left resize-pane -L 2
bind -n S-Right resize-pane -R 2
bind -n S-Down resize-pane -D 1
bind -n S-Up resize-pane -U 1

bind -n C-k send-keys -R \; send-keys C-l \; clear-history

set -g @yank_selection 'primary'
set -g @yank_selection_mouse 'clipboard'
set -g @yank_with_mouse on

# Allow tmux copies, while blocking application escape sequences from setting buffers.
set -s set-clipboard external

set -g default-terminal "tmux-256color"

set -as terminal-overrides ',tmux-256color:RGB'
set -as terminal-features ',tmux-256color:RGB'

set -s escape-time 10

set -as terminal-overrides ",xterm-256color:Tc"
set -s escape-time 0

